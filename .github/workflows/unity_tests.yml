name: Unity Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test_runner:
    name: Run Unity Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true 

      - uses: game-ci/unity-test-runner@v4
        id: testRunner
        with:
          unityVersion: 6000.2.2f1
          testMode: all 

      - uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ${{ steps.testRunner.outputs.artifactsPath }}